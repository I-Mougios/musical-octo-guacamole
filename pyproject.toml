[project]
name = "musical-octo-guacamole"
version = "0.1.0"
description = "My definitive recipe for a modern Python multi-project workspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (syntax/bugs)
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear (design traps)
    "S",   # Bandit (SAST Security scanning)
    "I",   # isort (clean import sorting)
]

# Ignore specific rules if they get too annoying
ignore = []
