# packages/kafka-core/pyproject.toml
[project]
name = "kafka-core"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "confluent-kafka==2.14.2",
]

[project.optional-dependencies]
cli = [
    "typer==0.26.7",
]

[project.scripts]
kafka = "kafka_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"